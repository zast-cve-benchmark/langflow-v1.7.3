services:
  langflow:
    image: langflowai/langflow:1.7.3 # or another version tag on https://hub.docker.com/r/langflowai/langflow
    pull_policy: always               # set to 'always' when using 'latest' image
    ports:
      - "7860:7860"
    depends_on:
      - postgres
    environment:
      - LANGFLOW_DATABASE_URL=postgresql://langflow:langflow@postgres:5432/langflow
      # This variable defines where the logs, file storage, monitor data and secret keys are stored.
      - LANGFLOW_CONFIG_DIR=/app/langflow
      - LANGFLOW_AUTO_LOGIN=true
      - LANGFLOW_SECRET_KEY=dev-secret-key-for-testing-only
    user: "root"
    volumes:
      - langflow-data:/app/langflow

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: langflow
      POSTGRES_PASSWORD: langflow
      POSTGRES_DB: langflow
    ports:
      - "5432:5432"
    volumes:
      - langflow-postgres:/var/lib/postgresql/data

  # cloudflared:  # 注释掉，如果不需要公网暴露
  #   image: cloudflare/cloudflared:2025.9.1
  #   depends_on:
  #     - langflow
  #   command: tunnel --no-tls-verify --url http://langflow:7860
  #   restart: unless-stopped

volumes:
  langflow-postgres:
  langflow-data:
